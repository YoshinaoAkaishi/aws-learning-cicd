name: Build And Publish Service A

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: my-app-api
  SERVICE_NAME: service-a
  CLUSTER_NAME: my-app-cluster
  ARTIFACT_BUCKET: pipeline-artifacts

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t temp_image .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::009160046789:role/GitHubActionsEcsLearningCourse

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag temp_image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" > image-uri.txt

      - name: Create deploy metadata
        run: |
          IMAGE=$(cat image-uri.txt)

          cat <<EOF > deploy.json
          {
            "cluster":"${CLUSTER_NAME}",
            "service":"${SERVICE_NAME}",
            "container":"api",
            "image":"${IMAGE}"
          }
          EOF

      - name: Package artifact
        run: |
          zip deploy.zip deploy.json

      - name: Upload artifact to S3
        run: |
          aws s3 cp deploy.zip \
            s3://${ARTIFACT_BUCKET}/service-a/deploy.zip