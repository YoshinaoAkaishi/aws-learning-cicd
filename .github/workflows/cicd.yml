name: Web API Deploy Pipeline

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'cicd-section/api/**'
      - 'cicd-section/.aws/**'

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: my-app-api
  ECS_TASK_DEFINITION_API: cicd-section/.aws/task-def-api.json

permissions:
  id-token: write
  contents: read

jobs:

  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cicd-section/api

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker image build -t temp_api_image:latest .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::009160046789:role/aws-learning-pushrole-team1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker image tag temp_api_image:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker image push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" > api-image-uri.txt

      - name: Upload image URI artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-image-uri
          path: cicd-section/api/api-image-uri.txt

  package-for-codepipeline:
    runs-on: ubuntu-latest

    needs:
      - test-and-build

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image URI artifact
        uses: actions/download-artifact@v4
        with:
          name: api-image-uri
          path: artifacts

      - name: Define image URI
        run: |
          echo "API_IMAGE_URI=$(cat artifacts/api-image-uri.txt)" >> $GITHUB_ENV

      - name: Render ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_API }}
          container-name: api
          image: ${{ env.API_IMAGE_URI }}

      - name: Create deployment package
        run: |
          mkdir deploy

          cp \
            "${{ steps.render-task-def.outputs.task-definition }}" \
            deploy/taskdef.json

          cd deploy

          zip deployment.zip taskdef.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::009160046789:role/aws-learning-pushrole-team1

      - name: Upload deployment package to S3
        run: |
          aws s3 cp \
            deploy/deployment.zip \
            s3://aws-learning-team1/deployment.zip