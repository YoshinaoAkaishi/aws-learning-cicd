name: Build And Publish Repo1

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: my-app-api
  ARTIFACT_BUCKET: pipeline-artifacts

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cicd-section/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t temp_image .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::009160046789:role/GitHubActionsEcsLearningCourse

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag temp_image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          cat <<EOF > deploy.json
          {
            "deploy_repo1": true,
            "deploy_repo2": false,
            "image": "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          }
          EOF

      - name: Package Artifact
        run: |
          zip deploy.zip deploy.json

      - name: Upload To S3
        run: |
          aws s3 cp deploy.zip s3://${ARTIFACT_BUCKET}/deploy.zip